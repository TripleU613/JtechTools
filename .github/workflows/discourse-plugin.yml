name: Discourse Plugin

on:
  push:
    branches:
      - main
  pull_request:
  # Manual trigger so we can run the full Discourse plugin matrix
  # (linting, backend_tests, system_tests, annotations_tests) against
  # an arbitrary branch on this fork without needing an upstream PR
  # (which is gated on a manual workflow approval for fork
  # contributors). `gh workflow run "Discourse Plugin" --ref <branch>`.
  workflow_dispatch:

jobs:
  ci:
    uses: discourse/.github/.github/workflows/discourse-plugin.yml@v1
    # Force lowercase plugin directory. Discourse derives the compiled
    # stylesheet bundle slug from the on-disk dir, and the route that
    # serves /stylesheets/<slug>_<hash>.css is constrained to
    # `[-a-z0-9_]+`. The default (`github.event.repository.name`)
    # evaluates to "JtechTools" (uppercase) which broke every CSS
    # request → "Refused to apply style" → unstyled plugin everywhere.
    # Same fix b284c8d applied for local dev; missing here is why the
    # SCSS bug came back in this PR's system_tests.
    with:
      name: jtech-tools

  # Dumbcourse is written in TypeScript and shipped as a prebuilt ES5 bundle
  # in public/. Type-check it, run its unit tests, and fail if the committed
  # bundle doesn't match the sources (run `pnpm dumbcourse:build`).
  dumbcourse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:dumbcourse

  # The bundled JTech theme (themes/jtech) is compiled by core's theme
  # pipeline, not the plugin build, so the reusable workflow's lint doesn't see
  # it. Lint it on its own (ESLint, Prettier, stylelint).
  theme:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:theme

  # The TypeScript scripts under scripts/ (theme check, README images) run on
  # a developer's machine, so nothing else type-checks them. Also holds the
  # repo to Ruby, TypeScript and SCSS (AGENTS.md).
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:scripts
      - run: pnpm lint:languages
