  theme_metadata:
    description: "JTech: Vercel-style AMOLED black and pure white, hairline borders, Geist type."
    settings:
      header_home_url: "Where the header's house icon goes (the JTech homepage). Leave blank to hide it."
      color_mode_toggle: "Light / dark switch in the command menu (and its g o shortcut), and in the header when header_color_toggle is on. Clicking back to the mode your device uses returns to following the device."
      header_color_toggle: "Light / dark icon in the header, beside the bell (needs color_mode_toggle). Off: people switch from the sidebar's Color mode menu or the command menu. The sidebar menu is Discourse's own; it shows while the site setting interface color selector is set to sidebar footer. While the icon shows, it replaces Discourse's header colour selector."
      palette_menu: "Palette button in the sidebar footer: every palette the theme offers (JTech, Dim and the colour pairs), switched with one click and no reload. Members keep their choice on every device (it is the same setting as Preferences → Interface); visitors keep it in this browser. Hidden when there is only one palette to choose."
      density_menu: "Density button in the sidebar footer, beside the palette button: topic lists as they are, Comfortable (cards without the excerpt and picture) or Compact (one row a topic), like Gmail's. Kept in this browser."
      overlay_scrollbar: "Thin overlay scrollbar for the page (macOS style) on mouse/trackpad devices, instead of the browser's wide classic one."
      back_to_top: "Floating back-to-top button on long pages (not on topics, which have their own)."
      command_menu: "⌘K / Ctrl+K command menu: jump to pages, categories, topics and people, or run an action."
      card_thumbnails: "Show the topic's first image beside its title on topic cards."
      code_language_labels: "Header showing the language on code blocks whose author named one (```bash)."
      code_line_numbers: "Line numbers in a gutter beside code blocks of two or more lines. Copying a block copies the code only."
      first_reply_prompt: "Under a topic's first post, while nobody has replied and the reader can: a short prompt to be the first to reply. Not shown in messages."
      first_reply_prompt_hidden_categories: "Categories where the first-reply prompt isn't shown."
      user_card_last_seen: "Show when someone was last seen on their user card. People who hide their profile and presence are left out."
      copy_post_button: "A Copy button in each post's menu that copies the post's text as Markdown, beside Copy link. Only for the groups in copy_post_groups."
      copy_post_groups: "Groups that get the Copy button (copy_post_button). Trust level 1 by default."
      closed_reply_warning: "When someone replies to a closed or archived topic (only staff and the category's moderators can), say so in the composer, with buttons to reopen or unarchive the topic."
      selection_search: "Add Search to the buttons over text selected in a post (Quote, Edit, Copy). It opens the search page for the selection, up to 100 characters. Hidden from visitors who can't search."
      replies_filter: "Add a dropdown beside categories and tags over topic lists to show all topics, only those with replies, or only those nobody has replied to yet."
      print_button_categories: "Categories (and their subcategories) whose topics get a Print button on the first post. It prints the first post on its own, or saves it as a PDF. Discourse's own print view (Ctrl+P on a topic) prints the whole topic."
      table_of_contents: "Contents for a topic's first post, listing its headings: in the timeline's column on desktop, with the section being read marked, and as a card at the top of the post on phones. For first posts in table_of_contents_categories, and any first post with DiscoTOC's marker (the composer's + menu → Table of contents adds it). At least 3 headings."
      table_of_contents_categories: "Categories (and their subcategories) whose first posts get contents without the marker."
      voice_recorder: "A microphone button in the composer to record a voice message and add it to the post as an audio file. Shown when the browser can record and the recording's file type (m4a, ogg or webm, depending on the browser) is in authorized_extensions. A recording stops by itself before it would pass max_attachment_size_kb."
      post_badges: "Badges to show after a poster's name on their posts, when they have them, in this order. Each links to its badge page. Use each badge's exact name from Admin → Badges (case doesn't matter, spaces do)."
      image_carousels: "Show the pictures in posts written with the Post Image Carousel component ([wrap=Carousel]) as Discourse's own carousel, the one [grid mode=carousel] makes. The component's autoplay, loop and thumbnails aren't carried over."
      sidebar_inboxes: "For people in groups with a shared inbox (on the forum, staff): an Inboxes section in the sidebar with their own messages and each group's, with unread counts. Everyone else keeps Discourse's My Messages link."
      online_box: "With the Who's Online plugin: a button beside the topic list's tabs, Online: 3, instead of the plugin's row of avatars over the list. Clicked, a box pops out under it with everyone online, each a link to their profile. Shown to whoever the plugin shows its row to, while at least its minimum are online."
      reader_mode: "A reader mode switch at the top of a topic's timeline (and Ctrl+Alt+R): the sidebar goes, the header and the posts' buttons fade back until pointed at, and the posts' text can be made larger, narrower or wider, or set in a serif. Text settings are kept per browser."
      qr_code_share: "Add QR code to the share options (sharing a topic or a post, and the buttons over a quote): the link as a code to scan with a phone, with a button to save it as an image."
      topic_jump_buttons: "First-post and last-post buttons under the topic timeline, and beside the progress button on phones."
      hide_lock_icons: "Hide the padlock on private categories' badges and links (everyone who sees the category already has access)."
      gated_categories: "Categories whose topics logged-out visitors can't read: the first post fades out under a prompt to log in or create an account. This only hides topics in the browser (they're still sent to the visitor); to really keep a category private, change its security settings."
      gated_tags: "Same as gated_categories, for topics with any of these tags."
      mobile_small_logo: "On phones, show the small (square) logo in the header instead of the wide one. A mobile logo uploaded in the site settings still takes priority."
      quick_look: "Add a Quick look button to topic cards that previews the first post in a dialog. Signed-in members only, so it can't get round a login gate."
      reading_progress: "Thin bar under the header showing how far through a topic you are."
      external_link_icon: "Mark links in posts that go to other sites with a small arrow."
      internal_hosts: "Hosts that count as this forum (no arrow). Matched exactly; the current host always counts."
      category_banners: "Show a header with the category's icon, name, description and counts on category pages."
      tag_banners: "Show a header with the tag's name and description on tag pages."
      footer_enabled: "Show the JTech footer once a page has fully loaded."
      footer_tagline: "Line under the footer logo. Leave blank to hide."
      footer_links: "Footer links. Links sharing a section form one column, in the order sections first appear."
      hero_enabled: "Show the front-page hero (headline, search, and Sign Up / Log In for visitors) on the homepage, Latest and Categories."
      hero_title: "Hero headline."
      hero_subtitle: "Hero supporting line. Leave blank to hide."
      hero_search_placeholder: "Placeholder text in the hero search box."
      hero_dismissible: "Let people close the hero. It comes back if the headline changes."
      hero_planet: "Draw the turning planet behind the hero. It pauses while it's off screen, stays still for people who ask their device for reduced motion, and is left out of Windows high contrast mode."
      topic_cards: "Show discovery topic lists (latest, new, top, categories, tags) as cards."
      corner_style: "Corner shape: squircle (smooth superellipse corners), sharp (Vercel), soft, or round (pill buttons)."
      monochrome_categories: "Show category colors in grayscale (badges and sidebar icons)."
      monochrome_letter_avatars: "Render generated letter avatars in grayscale. Uploaded avatars keep their color."
      monochrome_heatmap: "Use weight instead of orange/red for busy view and reply counts."
      lucide_icons: "Draw Discourse's icons with Lucide's thin outline set (lucide.dev) instead of Font Awesome: the header, sidebar, post menu, notifications and the rest. Brand logos and icons without a Lucide match keep Font Awesome, and so does everything under the Discourse palette, which looks like stock Discourse."
      monochrome_flair: "Draw the avatar flair of trust levels, moderators and admins in black and white with JTech's own marks: a ring for new users, one to three chevrons for trust levels 1–3, a star for 4, a shield for staff (filled for admins). The groups' own colors and icons are ignored while it's on; other groups' flair keeps them."
