# JTech Forums' words and links in the JTech theme (jtechforums.org), as a
# starting point for your own. With the theme installed (jtech_theme_install),
# from /var/discourse:
#
#   ./launcher enter app
#   rake jtech:theme:settings < plugins/jtech-tools/docs/setup/theme-settings.yml
#
# or set them in Admin → Appearance → Themes → JTech. Every other theme
# setting is left at its default. Making JTech the site's default theme is
# up to you (same page).

