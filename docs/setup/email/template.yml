# The email template (/admin/customize/email_style, HTML tab), kept as YAML
# because the repo holds no hand-written HTML. Paste the value of `html`.
html: |
  <!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
  <html xmlns="http://www.w3.org/1999/xhtml" lang="%{html_lang}" xml:lang="%{html_lang}">
    <head>
      <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      %{dark_mode_meta_tags}
      <meta name="x-apple-disable-message-reformatting" />
      <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
      <title></title>
      <!-- JTech theme. Colours live here, not in the custom CSS: Discourse
           inlines that CSS on every element, and only a stylesheet can swap
           colours for dark mode. Each block is separate so a client that
           rejects one (Gmail and the dark-mode query) keeps the others. -->
      <style type="text/css">
        html, body, .jt-page { background-color: #fafafa !important; }
        .jt-card blockquote { border-left-color: #d4d4d4 !important; }
        .jt-card hr { background-color: #ebebeb !important; }
        .jt-card code { background-color: #f2f2f2 !important; color: #000000 !important; }
        .jt-card pre code { background-color: #fafafa !important; border-color: #ebebeb !important; }
        .jt-card .digest-content-header,
        .jt-card .digest-content-header .with-accent-colors { background-color: #fafafa !important; color: #000000 !important; }
        .jt-card .popular-post-meta,
        .jt-card .digest-topic-stats { border-bottom-color: #ebebeb !important; }
        .jt-card .onebox,
        .jt-card .digest-content-header { border-color: #ebebeb !important; }
      </style>
      <style type="text/css">
        @media (prefers-color-scheme: dark) {
          html, body, .jt-page { background-color: #000000 !important; }
          .jt-card { background-color: #0a0a0a !important; border-color: #1f1f1f !important; color: #ededed !important; }
          .jt-head, .jt-head a, .jt-head span { color: #ffffff !important; }
          .jt-foot, .jt-foot a { color: #8f8f8f !important; }
          .jt-card td, .jt-card p, .jt-card li, .jt-card span, .jt-card div, .jt-card center,
          .jt-card h1, .jt-card h2, .jt-card h3, .jt-card h4, .jt-card h5, .jt-card h6 { color: #ededed !important; }
          .jt-card a { color: #ffffff !important; }
          .jt-card .notification-date, .jt-card .digest-created-at, .jt-card .digest-topic-stat span,
          .jt-card .digest-new-topic-stat p, .jt-card .previous-discussion, .jt-card .onebox-metadata,
          .jt-card .reply-above-line { color: #8f8f8f !important; }
          .jt-card .footer, .jt-card .footer p, .jt-card .footer a,
          .jt-card .summary-footer td, .jt-card .summary-footer a { color: #a1a1a1 !important; }
          .jt-card .highlight a:first-child, .jt-card .digest-button {
            background-color: #ffffff !important; border-color: #ffffff !important; color: #000000 !important;
          }
          .jt-card .digest-content-header,
          .jt-card .digest-content-header .with-accent-colors { background-color: #111111 !important; border-color: #1f1f1f !important; color: #ffffff !important; }
          .jt-card blockquote { background-color: #111111 !important; border-left-color: #454545 !important; color: #ededed !important; }
          .jt-card code { background-color: #1a1a1a !important; color: #ededed !important; }
          .jt-card pre code { background-color: #111111 !important; border-color: #1f1f1f !important; }
          .jt-card hr { background-color: #1f1f1f !important; }
          .jt-card .onebox { border-color: #1f1f1f !important; }
          .jt-card .popular-post-meta, .jt-card .digest-topic-stats { border-bottom-color: #1f1f1f !important; }
        }
      </style>
      <style type="text/css">
        @media only screen and (max-width: 620px) {
          .jt-pad { padding: 16px 10px 24px !important; }
          .jt-card { padding: 20px 18px !important; border-radius: 12px !important; }
        }
      </style>
    </head>

    <body class="jt-body" style="margin: 0; padding: 0; background-color: #fafafa; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%;">
      <!--[if mso]>
        <style type="text/css">
          body, table, td, th, p, a, h1, h2, h3, h4 { font-family: Arial, sans-serif !important; }
        </style>
      <![endif]-->

      <div class="jt-preview" style="display: none; max-height: 0; overflow: hidden; mso-hide: all; font-size: 1px; line-height: 1px; opacity: 0;">%{email_preview}</div>

      <table role="presentation" class="jt-page" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#fafafa" style="background-color: #fafafa; width: 100%;">
        <tr>
          <td class="jt-pad" align="center" style="padding: 32px 16px 40px;">
            <!--[if mso]><table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" align="center"><tr><td><![endif]-->
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width: 100%; max-width: 600px; margin: 0 auto;">
              <tr>
                <td class="jt-head" style="padding: 0 4px 16px; font-family: Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; color: #000000;">
                  <a href="/latest" style="color: #000000; text-decoration: none; font-weight: 600;">
                    <img src="/plugins/jtech-tools/jtech-app-icon.png" width="28" height="28" alt="" style="width: 28px; height: 28px; border: 0; border-radius: 7px; vertical-align: middle; display: inline-block;" />
                    <span style="vertical-align: middle; padding-left: 8px; color: #000000;">JTech Forums</span>
                  </a>
                </td>
              </tr>
              <tr>
                <td class="jt-card" bgcolor="#ffffff" style="background-color: #ffffff; border: 1px solid #ebebeb; border-radius: 16px; padding: 28px 28px; color: #000000; font-family: Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 16px; line-height: 1.6; letter-spacing: -0.006em; text-align: left;">
                  %{email_content}
                </td>
              </tr>
              <tr>
                <td class="jt-foot" style="padding: 20px 4px 0; font-family: Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 13px; line-height: 1.5; color: #737373;">
                  <a href="/latest" style="color: #737373; text-decoration: none; font-weight: normal;">JTech Forums</a>
                  &nbsp;&middot;&nbsp;
                  <a href="/my/preferences/emails" style="color: #737373; text-decoration: underline; font-weight: normal;">Email settings</a>
                </td>
              </tr>
            </table>
            <!--[if mso]></td></tr></table><![endif]-->
          </td>
        </tr>
      </table>

      <!-- Stops Gmail on iOS from enlarging the text -->
      <div style="display: none; white-space: nowrap; font: 15px courier; line-height: 0;">
        &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;
        &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;
        &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;
      </div>
    </body>
  </html>
