  site_settings:
    # NOTE: core renders `site_settings.<name>` as the setting's DESCRIPTION;
    # the label is derived from the setting name and is not translatable.
    # There is no `<name>_description` key — core never reads one.
    # Tab/category names live in client.en.yml under
    # admin_js.admin.site_settings.categories.

    # ── Jtech (master) ─────────────────────────────────────────────────────
    jtech_enabled: Master gate for the whole Jtech plugin bundle. Every
      sub-plugin also has its own enable switch on its tab for fine-grained
      control.

    jtech_row_click_theme_ids: Theme ids whose topic list rows open the topic
      from anywhere on the row (not just the title and the numbers) and bounce
      when pressed. Core only does the whole row on phones. 1 is the "Default"
      theme; empty turns it off everywhere.

    jtech_theme_install: Install the JTech theme that ships with this plugin,
      and update it when the plugin updates (on rebuild). It is never made the
      default or offered to users; do that under Customize → Themes. Turn this
      off to stop installs and updates; turning it on installs straight away and
      brings back a theme an admin deleted (which otherwise stays deleted).

    jtech_app_icon: Give the installed app (Install app / Add to Home screen)
      the JTech mark on a solid black square, so its taskbar and home-screen
      icon shows on light and dark backgrounds alike. It replaces the manifest
      icon site setting in the web manifest only; turn this off to use that
      upload instead. Reinstall the app to pick up a change.

    jtech_trust_level_flair: Show each member's trust level as their avatar
      flair when they haven't picked one, using the flair of their highest
      trust level group that has one (set the flair on the trust level groups
      under Groups). It moves up and down with their trust level. A member who
      picks another flair, or takes this one off, under Preferences → Account
      keeps their choice. Turning it on sets it for everyone within a few
      minutes; turning it off leaves the flairs it gave, which members can
      change.
    jtech_badge_thresholds: Lower the top rungs of core's badge ladders to
      what members here actually reach — likes on a post or topic (15 and 20
      instead of 25 and 50), visitors from shared links, clicks on posted
      links, Admired, the daily like limit, visit streaks (30 and 100 days
      instead of 100 and 365) and solutions (3, 10 and 25 instead of 10, 50
      and 150). Core puts its numbers back on every rebuild, so this sets them
      again after. Turning it off takes effect on the next rebuild, and
      badges whose numbers go back up are taken away on the next daily badge
      run.

    # ── Jtech — Dislike ────────────────────────────────────────────────────
    discourse_no_likes_enabled: Turn on phantom reactions. When off, likes and
      reactions behave exactly as Discourse ships them in every category and
      none of the settings below have any effect.

    no_reactions_category_ids: Categories in which likes and reactions are
      treated as "phantom". Nothing happens until at least one category is
      selected. Subcategories are not included automatically — add each one
      explicitly.

    dislike_hide_like_button: Hide the like and reaction buttons in these
      categories, and reject like requests that reach the API anyway. Existing
      likes are left in place. This overrides
      {{setting:dislike_allowed_like_groups}} — while it is on, nobody can
      like, whatever that list says.

    dislike_allowed_like_groups: Restrict liking in these categories to members
      of these groups; everyone else gets no like button. Leave empty to allow
      every logged-in user — unlike most group settings, empty means
      "everyone", not "nobody". Anonymous likes are not filtered by this list.

    dislike_show_in_history: Treat phantom likes like normal likes for
      history — the liker's "Likes Given", the author's "Likes Received" and
      the author's "liked" or "reacted" notification. When off, phantom likes
      never notify the author and leave no activity-stream rows.

    dislike_count_in_leaderboard: Let phantom likes count toward likes given
      and received — the user directory, user cards and profile summaries.
      When off they are left out of those totals, which are corrected each
      time the directory refreshes (hourly). Like counts on the posts,
      badges and trust-level requirements are not affected.

    dislike_record_audit_trail: Write one row per phantom reaction to the
      discourse_no_likes_phantoms table — likes, plus any non-default
      discourse-reactions emoji. There is no admin screen for this table;
      query it with the Data Explorer. Turn off to skip an extra insert on
      every like in these categories.

    purge_phantom_likes_now: Run the clean-up job now; it switches itself
      back off when it starts. The job applies the settings above to likes
      made before them. It back-fills the audit table and, unless
      {{setting:dislike_show_in_history}} is on, removes the matching
      activity-stream rows and "liked"/"reacted" notifications. It then
      recalculates likes given and received. It never deletes likes.

    # ── Jtech — Alternate SMTP ─────────────────────────────────────────────
    discourse_another_email_enabled: Send outbound forum email through the
      relay configured below instead of the server's DISCOURSE_SMTP_* host.
      Only the host, port, transport security and credentials are replaced —
      everything else in the mail configuration still applies. Mail sent from
      a group's own inbox (group SMTP) keeps using that group's mail server.
      Check the relay with "Send test email" under Admin → Email.

    discourse_another_email_smtp_address: Hostname or IP address of the
      relay — no scheme, port, or path. Leave empty to keep using the
      server's configured SMTP host; the rest of this tab is then ignored.

    discourse_another_email_smtp_port: 587 for STARTTLS submission, 465 for
      implicit TLS, 25 for an unauthenticated relay on a private network.
      Must agree with the transport security setting below.

    discourse_another_email_smtp_security: How the connection to the relay is
      encrypted. STARTTLS (opportunistic) upgrades only if the relay offers
      it and sends in the clear otherwise; STARTTLS (required) fails the
      delivery instead. Use Implicit TLS for port 465, and None only on a
      trusted private network.

    discourse_another_email_smtp_openssl_verify_mode: Set to "Do not verify"
      only if the relay presents a self-signed certificate, or one whose name
      does not match the relay host above. Doing so removes protection
      against interception of your outbound mail.

    discourse_another_email_smtp_authentication_mode: SMTP AUTH mechanism used
      with the credentials below. PLAIN and LOGIN both send the password in
      readable form, so pair them with TLS. Choose None for a relay that
      accepts mail without authenticating.

    discourse_another_email_smtp_username: SMTP AUTH user. Often a full
      mailbox address, but some providers expect a fixed token instead
      (SendGrid uses the literal "apikey"). Ignored while
      {{setting:discourse_another_email_force_smtp_username_to_sender}} is
      on.

    discourse_another_email_smtp_password: SMTP AUTH password or API key.
      Hidden in this form and filtered from staff action logs once saved, so
      verify it before saving — you will not be able to read it back.

    discourse_another_email_force_from_domain: Replaces the domain of every
      outgoing From address with this one, keeping the local part
      (noreply@forum.example becomes noreply@example.com). Set it when the
      relay only accepts mail from its own domain. Leave empty to send From
      addresses unchanged. Only applies while the alternate relay is enabled.

    discourse_another_email_force_smtp_username_to_sender: Logs in to the
      relay separately for each message, as that message's own From address
      with any +tag suffix removed, and after the domain rewrite above has
      been applied. This replaces the relay username entirely. Turn it on
      only for relays that require the AUTH user to match the sender, and
      only if the relay password is valid for every address the forum sends
      from.

    discourse_another_email_smtp_domain: Domain this forum announces in the
      SMTP HELO/EHLO greeting. Leave empty to keep the server's global HELO
      domain. Set it when the relay rejects mail whose HELO name does not
      resolve back to it.

    discourse_another_email_smtp_open_timeout_seconds: Seconds to wait for the
      connection to the relay to open before abandoning the delivery.

    discourse_another_email_smtp_read_timeout_seconds: Seconds to wait for
      each reply from the relay before abandoning the delivery.

    # ── Jtech — Mini-mod ───────────────────────────────────────────────────
    mini_mod_enabled: Master switch for Mini-mod. Everything on this tab
      applies only to category group moderators — users who moderate a
      category through a category moderation group, set up with
      {{setting:enable_category_group_moderation}}. It never applies to
      site-wide moderators (those are on the Jtech — Mod tab) and never
      changes anything for staff. While this is off, every setting below has
      no effect.

    mini_mod_manage_all_categories: Scope for the grants below. Off, a
      category group moderator's Mini-mod rights reach only the categories
      they actually moderate. On, they reach every category they can see,
      they may create top-level categories, and "Mini mod can edit topics"
      starts taking effect — that setting does nothing while this one is off.
      Categories they can't see stay out of reach either way. Turn this on
      deliberately; it is the widest switch on this tab.

    mini_mod_can_create_categories: Let category group moderators create
      categories. With "Mini mod manage all categories" off they may only
      create subcategories beneath a category they moderate; with it on, any
      category they can see, top-level included. A new subcategory gets its
      parent's security and moderators, so they can manage it and it is no
      more visible than its parent. Deleting categories is never granted.

    mini_mod_can_edit_categories: Let category group moderators open the
      category settings screens and save changes, for the categories they
      moderate — or for every category they can see when "Mini mod manage all
      categories" is on. Security (who can see and post), moderators,
      incoming email, review groups, category types, position and custom
      fields stay with staff, and a category can only be moved under one
      they moderate. Reordering the site's categories stays with staff.

    mini_mod_can_edit_topics: Let category group moderators edit any topic
      they can see and post in — title, category, tags and first post —
      unless the first post is locked. Private messages, archived topics and
      the TOS/FAQ/privacy pages are never included. This is site-wide and
      requires "Mini mod manage all categories"; while that is off, this
      setting does nothing. (Core's {{setting:edit_all_topic_groups}} grants
      the same to any group.)

    mini_mod_can_move_topics: Let category group moderators move topics into
      the categories they moderate, even where they couldn't start a topic
      themselves. With "Mini mod manage all categories" on they may also move
      topics past topic approval into any category they can post in.

    mini_mod_manage_tags: Let category group moderators create, rename and
      delete tags they can see and reach the tag administration screens.
      This is site-wide and is not limited to the categories they moderate.
      Tag groups, the CSV tag upload and "delete unused tags" stay
      staff-only. Requires {{setting:tagging_enabled}}.

    mini_mod_can_post_in_closed_topics: A restriction, not a grant. Discourse
      normally lets category group moderators reply inside closed topics in
      the categories they moderate; leaving this off takes that away. Turn it
      on to restore the standard behaviour. Staff are never affected.

    mini_mod_can_reopen_topics: A restriction, not a grant. Discourse normally
      lets category group moderators reopen closed topics in the categories
      they moderate; leaving this off takes that away — including "open"
      topic timers — and hides the reopen button on closed topics. Turn it on
      to restore the standard behaviour. Staff are never affected.

    tl4_can_post_in_closed_topics: A restriction, not a grant, and it reaches
      every trust level 4 user on the site — not only category group
      moderators. Discourse normally lets TL4 users reply inside closed
      topics; leaving this off takes that away. It is enforced by this
      module, so it only has any effect while {{setting:mini_mod_enabled}} is
      on. Staff are never affected.

    tl4_can_reopen_topics: A restriction, not a grant, and it reaches every
      trust level 4 user on the site — not only category group moderators.
      Discourse normally lets TL4 users reopen closed topics; leaving this
      off takes that away — including "open" topic timers — and hides the
      reopen button on closed topics. It is enforced by this module, so it
      only has any effect while {{setting:mini_mod_enabled}} is on. Staff are
      never affected.

    # ── Jtech — Mod ────────────────────────────────────────────────────────
    mod_categories_enabled: Master switch for the moderator tools in this
      module — topic tools, checklists, private staff notes and staff event
      notifications. Off means moderators lose every tool below,
      immediately. Letting moderators create and edit categories is core's
      {{setting:moderators_manage_categories}}. Whispers, the notification type filter and
      notification auto-mark have their own switches and keep working with
      this off.

    # ── Jtech — Mod: Topic tools ───────────────────────────────────────────
    precheck_new_topic_enabled: Shows a "before you post" prompt when a user
      starts a topic in a category that has one set. Moderators write the
      prompt, and its trust-level cap, in the category's settings.

    topic_footer_message_enabled: Lets moderators pin a message below the last
      reply of a topic. The footer is PUBLIC — every user who can read the
      topic sees it. For staff-only text, use private staff notes instead.

    mod_pin_post_enabled: Lets moderators pin any post in a topic to the
      bottom of that topic. The pinned copy and its in-stream badge are
      visible to every reader.

    mod_topic_require_reply_approval_enabled: Lets moderators flag individual
      topics so every reply goes to the review queue first. Staff and anyone
      who can review the topic post normally. Turning this OFF stops the
      queuing but does not clear the flags — re-enabling it resumes queuing
      on the same topics.

    mod_pm_badge_group_enabled: Lets staff composing a personal message expand
      a badge into its current holders as recipients. Every holder becomes a
      named participant of the PM and can see the others. The holder lookup
      is staff-only, so ordinary users cannot use it to enumerate badge
      membership.

    # ── Jtech — Mod: Checklists ────────────────────────────────────────────
    mod_first_post_checklist_enabled: Lets moderators maintain a checklist
      that users must accept before they can post, up to a trust-level cap
      set in the checklist itself (TL2 by default). Staff are exempt.
      Includes the acceptance audit log and forced re-acceptance.

    mod_targeted_checklists_enabled: Lets moderators aim a checklist at named
      users, blocking their posting anywhere on the forum until they accept —
      regardless of trust level, and including other moderators. Admins can
      never be targeted.

    mod_topic_prompt_checklist_enabled: Lets moderators attach a blocking
      checklist or single statement to one topic, shown before posting in it.
      Applies to everyone including staff, and can be set to re-prompt on
      every reply rather than once per user.

    topic_reply_prompt_enabled: Legacy — replaced by per-topic prompt
      checklists. Nothing writes new reply prompts; this only keeps showing
      prompts saved before the migration, and each topic's prompt is cleared
      the first time a moderator saves a prompt checklist for it. Turn off
      once no topic still relies on an old prompt.

    # ── Jtech — Mod: Notes ─────────────────────────────────────────────────
    mod_topic_private_notes_enabled: Lets staff attach a private note, with a
      reply thread, to any topic. Notes are serialized to staff only and
      never reach a regular user's topic JSON.

    mod_moderators_can_edit_others_notes: When on, any moderator may edit or
      delete notes and note replies written by other staff. Notes keep no
      revision history, so such a change is silent and cannot be recovered —
      leave off unless you need it. Authors can always edit their own notes;
      admins can always edit any note.

    mod_note_view_tracking_enabled: Records each staff member's name and the
      time they opened a topic's note panel, and shows the list ("Viewed by
      N") to all staff on that topic.

    mod_notes_feed_enabled: The staff user-menu shield tab — a cross-forum
      feed of noted topics and staff events, with its unread counter kept in
      sync with the notification bell.

    # ── Jtech — Mod: Notifications ─────────────────────────────────────────
    mod_notify_staff_on_topic_notes: Sends every other admin and moderator a
      bell notification and live alert when a staff member writes or replies
      to a topic note. The notification carries the first 300 characters of
      the note.

    mod_notify_staff_on_post_actions: Notifies every other staff member when a
      moderator deletes a post or rejects a queued post. Self-deletes and
      system actions are skipped. Approvals are separate — see
      {{setting:mod_notify_staff_on_post_approved}}.

    mod_notify_staff_on_post_approved: Notifies every other staff member when
      a moderator approves a queued post. Off by default — approvals are
      routine and noisy.

    mod_notify_staff_on_user_notes: Notifies every other staff member when a
      moderator adds a note to a user's profile. Requires the
      discourse-user-notes plugin; does nothing without it.

    mod_notify_staff_on_flag_notes: Notifies every other staff member when a
      moderator adds a note to a flag or other reviewable in the review
      queue. Requires a Discourse version with reviewable notes.

    mod_notify_whisper_targets: Sends a bell notification to a whisper's
      audience when one is posted, and to a user when staff add them to a
      whisper. Members of an automatic group the whisper is to (a trust level,
      everyone, staff) can read it but aren't notified, so a whisper to a
      trust level doesn't ring hundreds of bells. Off means whispers still
      work but arrive silently.

    mod_auto_mark_notifications_seen: Opening a topic, or the review queue,
      marks THIS plugin's own note and whisper notifications for it as read.
      Core notifications and other plugins' notifications are untouched.
      Independent of the Enable Mod master switch.

    mod_notification_type_filter_enabled: Adds a type filter to the user
      notifications page, plus a staff-only mod-notes stream. While a filter
      is active the plugin renders that page's results itself instead of
      Discourse — turn this off first when troubleshooting the notifications
      page. Independent of the Enable Mod master switch.

    # ── Jtech — Mod: Whispers ──────────────────────────────────────────────
    mod_whisper_enabled: Master switch for creating whispers — independent of
      Enable Mod, so whispers keep working when the rest of the module is off.
      A whisper is visible only to staff, its author and the users, groups and
      badges it names. Turning this OFF stops new whispers; existing whispers
      stay private (convert one to public to publish it).

    mod_whisper_add_participant_enabled: Lets staff add users to an existing
      whisper. They are notified and can read that whisper and replies that
      keep its audience — not other whispers in the topic.

    mod_whisper_convert_enabled: Lets staff turn an existing post into a
      whisper and back, and retarget its audience. Converting to public
      re-indexes the post so it becomes searchable again; converting to a
      whisper removes it from the search index.

    mod_whisper_badge_targeting_enabled: Lets staff target whispers at badge
      holders as well as users and groups. Membership is checked when the
      whisper is read, so a user who later earns the badge can read earlier
      whispers, and one who loses it loses access.

    mod_whisper_audience_aware_topic_list: Lets a whisper count as a new,
      unread post for the non-staff users, groups and badge holders it is
      addressed to (staff always see whispers as new). Off, only its
      notification tells them about it. Whispers never bump a topic or count
      as new for anyone outside their audience either way. On, a whisper also
      stops leaving a topic unread for people who can't see it but are in
      whispers_allowed_groups (a moderator under an admin's whisper, a group
      member it doesn't name), because their last read moves past it.

    # ── Jtech — Translator tweaks ──────────────────────────────────────────
    translator_tweaks_enabled: Master switch for the Jtech tweak to the
      upstream discourse-translator plugin. Inert unless that plugin is
      installed. The proxy below is applied once at boot, so turning this
      off doesn't send translation traffic back to Google until the site is
      restarted.

    translator_tweaks_worker_url: 'Base URL the bundled Google translate
      provider is pointed at instead of translation.googleapis.com — include
      the full /language/translate/v2 path; /detect and /languages are
      appended to it. Leave blank to let discourse-translator call Google
      directly. Every post being translated or language-detected, and the
      site''s Google API key, are sent to this host, so only enter a proxy
      you control. The endpoints are swapped at boot, so editing or clearing
      this has no effect until a full app restart (./launcher restart app).'

    # ── Jtech — Smart search ─────────────────────────────────────────────
    smart_search_enabled: When a search returns few results, run it again
      with synonyms substituted and merge the extra hits in, so that "js"
      also finds posts that only say "javascript" and "k8s" finds
      "kubernetes". Synonyms come from a bundled English lexical database
      (WordNet) plus a tech-jargon dictionary shipped with the plugin; add
      your own groups in {{setting:smart_search_extra_synonyms}}. Everything
      runs in-process — no external services, no API keys — and any failure
      falls back to ordinary Discourse search.

    smart_search_minimum_results: Synonym variants only run when the user's
      original search returned fewer than this many posts. Higher values
      expand more often — better recall, more database queries per search.
      Set to 1 to expand only when the original search found nothing. Values
      above your "search page size" setting mean every search expands.

    smart_search_variant_limit: How many synonym-substituted searches may run
      in addition to the user's original one. Each is one extra database
      query. 2 runs both variants that can be built (every word swapped for
      its top synonym, and only the first word swapped); 1 runs only the
      every-word-swapped variant.

    smart_search_extra_synonyms: Site-specific synonym groups added on top of
      the dictionary shipped with the plugin. One group per entry, lowercase,
      words separated by commas — for example "sib,self-injury,self injury".
      Every word in a group is treated as a synonym of every other word in
      it. Takes effect immediately; the shipped dictionary is left untouched.

    # ── Jtech — Desktop pop-ups ────────────────────────────────────────────
    popup_notifications_enabled: Show a small pop-up card in the top-right
      corner when a notification arrives. Desktop browsers only — it never
      renders on mobile. Purely additive — the bell counter, the
      notifications dropdown and read state are untouched. Each user must
      also switch it on under Preferences → Account; turning this off hides
      that preference. Browser tabs that are already open pick the change up
      on their next page load.

    popup_notifications_default_enabled: What "Desktop Pop Up Notifications"
      starts out as for users who have never touched it on their account
      page. Leave this off so switching the feature on does not start popping
      cards up for the entire forum at once. Users who have already made a
      choice keep it either way.

    popup_notifications_timeout_seconds: How long a card stays on screen
      before it disappears on its own. Clicking a card opens the notification
      it came from; clicking anywhere else on the page dismisses every card
      at once.

    popup_notifications_max_stack: How many cards may be stacked at once. The
      newest sits at the top, just below the header; when the stack is full a
      new notification pushes the oldest card off the bottom.

    popup_notifications_excluded_types: Notification kinds to leave out of the
      pop-ups — likes, for example, are usually the noisiest. Excluded kinds
      still appear in the bell and the notifications dropdown as normal.
      Leave empty to pop up for every kind of notification.

    # ── Jtech — Dumbcourse ─────────────────────────────────────────────────
    dumbcourse_enabled: Serve the Dumbcourse single-page app at the base path
      below. When off, every URL under that path returns 404.

    dumbcourse_base_path: First URL segment the app is served from, without
      slashes — "dumb" serves it at /dumb. Must be a single path segment and
      must not collide with a Discourse route such as admin, t or u; core
      routes always win, so a colliding value makes the app unreachable.
      Takes effect immediately, no restart required.

    dumbcourse_default_theme: Colour scheme applied the first time someone
      opens the app. "auto" follows the phone's own light/dark setting (and is
      dark on phones that have none). Each visitor can switch afterwards and
      their choice is remembered in that browser, so changing this only
      affects new visitors.

    dumbcourse_device_pairing_enabled: Offer "Sign in with another device" —
      the phone shows a short code, and the member approves it from any
      device where they're already signed in (like signing in to a TV). Saves
      typing a password on a keypad. Codes last ten minutes, only the
      requesting browser can use the approval, and code lookups are rate
      limited.

    dumbcourse_redirect_legacy_browsers: Send visitors whose browser can't
      run the full forum (KaiOS, Opera Mini, old Android and Chrome/Firefox
      versions, and anything in browser update user agents) to the matching
      Dumbcourse page instead of the broken full site — including sign-in,
      email-login and password-reset links. Members who choose "Open forum
      links here" in Dumbcourse's preferences are sent there too. Search
      engine crawlers are never redirected.

    dumbcourse_default_view: Topic list shown when someone opens the app at
      its root URL. "My posts" falls back to Latest for signed-out visitors.

    dumbcourse_show_category_names: Show each topic's category name on the
      topic list rows.

    dumbcourse_topic_posters_visibility: Which devices show the latest-poster
      avatars on topic list rows. The app treats a viewport narrower than the
      mobile breakpoint as mobile.

    dumbcourse_online_glow_enabled: Draw a glow ring around the avatars of
      users who are currently online.

    dumbcourse_sidebar_link_enabled: Add a Dumbcourse link to the sidebar of
      the main Discourse forum, pointing at the base path above. This does
      not affect the app itself.

    dumbcourse_pagination_enabled: Use Prev/Next page buttons on topic lists
      instead of infinite scroll.

    dumbcourse_topics_per_page: Topics fetched per page. Has no effect unless
      pagination is enabled — with infinite scroll the app uses Discourse's
      own page size. Discourse rejects values above 100.

    dumbcourse_push_enabled: Allow devices to register for push notifications
      and publish each new notification to Redis. This only reaches users
      running the native Dumbcourse wrapper app — the browser app has no
      service worker, so a separate listener must subscribe to the
      dumbcourse_push Redis channels to actually deliver anything.

    dumbcourse_languagetool_enabled: Add a Refine button to the Dumbcourse
      app's reply, edit, new-topic and new-message composers. It sends the
      draft to LanguageTool and immediately applies the first suggested
      replacement for every match — there is no review step and no undo, so
      the draft is rewritten in place. Does not affect the main Discourse
      composer.

    dumbcourse_languagetool_mode: Which LanguageTool backend to use.
      Self-hosted uses the server URL and secret settings; the cloud API uses
      the endpoint, username and API key settings.

    dumbcourse_languagetool_url: 'Self-hosted mode only. Address of your
      LanguageTool server, e.g. https://lt.example.com. The /v2/check suffix
      is appended for you if you leave it off. Always include https:// — a
      bare host would send the secret below in cleartext.'

    dumbcourse_languagetool_secret: 'Self-hosted mode only, optional. Sent as
      "Authorization: Bearer <value>". To send a different header instead,
      enter it as "Header-Name: value" — everything before the first colon
      becomes the header name.'

    dumbcourse_languagetool_api_url: Cloud API mode only. LanguageTool cloud
      endpoint. Leave at the default unless LanguageTool has given you a
      dedicated endpoint.

    dumbcourse_languagetool_api_username: Cloud API mode only, optional. The
      account e-mail for a LanguageTool Premium plan. Leave blank to use the
      free tier. If you set this you must also set the API key, or every
      Refine request is rejected.

    dumbcourse_languagetool_api_key: Cloud API mode only. The API key paired
      with the username above. Setting a key without a username makes
      LanguageTool reject the request.

    # ── Jtech — Disteleplus ────────────────────────────────────────────────
    disteleplus_enabled: Two-way bridge between one Telegram group and the
      native /disteleplus conversation. Everything below is inactive until
      this is on. The official Discourse Chat plugin is not required.

    disteleplus_bot_token: Token from @BotFather (/newbot). The bot must be a
      member of the bridged group, be a group admin, and have privacy mode
      disabled (/setprivacy in @BotFather) — otherwise Telegram never shows
      it other people's group messages and nothing arrives.

    disteleplus_telegram_chat_id: The bridged group's numeric chat ID — a
      negative number such as -1001234567890. Add the bot to the group, then
      read the ID from @RawDataBot or from getUpdates. Messages from any
      other group are ignored and logged to /logs.

    disteleplus_setup_commands_enabled: Allow Telegram group administrators
      to bind General, bind an existing upload topic, create the upload topic,
      bind the moderation-reports topic, and inspect setup through
      /disteleplus_* commands. Commands are consumed by the setup wizard and
      never copied into the conversation. Binding reports additionally
      requires the sender to be mapped (by Telegram numeric ID) to a Discourse
      admin. Turn this off after setup if Telegram-side reconfiguration is not
      wanted.

    disteleplus_chat_topic_id: Optional Telegram Forum Topic ID for the
      two-way conversation bridge. Set this when the group uses topics so
      conversation traffic stays in one topic. Zero uses General (the whole
      group), except that the forum-upload archive topic is always excluded.

    disteleplus_webhook_secret: Shared secret that Telegram sends back in the
      X-Telegram-Bot-Api-Secret-Token header; it is the only thing
      authenticating the inbound webhook. Leave this blank and it is
      generated for you the first time you press the "Register Telegram
      webhook" button on this tab. If you change it by hand, press the button
      again — until you do, every inbound message is rejected.

    disteleplus_chat_channel_id: The legacy bridged channel's numeric ID — the
      last part of its old URL. This is read only by the optional administrator
      history importer and is never used for live messages.

    disteleplus_allowed_groups: Groups allowed to open and participate in the
      native Disteleplus conversation. Staff is the safe default.
      Administrators are always allowed.

    disteleplus_bridge_bot_username: The Discourse account that posts Telegram
      messages from senders who are not mapped to a Discourse user. If no
      account with this username exists it is created automatically, at trust
      level 4, the first time it is needed. Point it at an existing account
      to reuse one.

    disteleplus_user_map: Telegram accounts that post into chat as a specific
      Discourse user. Without a mapping, a Telegram sender is matched only
      when their Telegram username is identical to a Discourse username; a
      mapping here overrides that. Everyone else posts through the bridge bot
      with their Telegram name as a prefix. Security note — anyone who
      controls a mapped Telegram account can post as that Discourse user, so
      only map people you trust, and fill in the Telegram numeric ID for
      staff — moderation buttons in the reports topic only honor rows with a
      numeric ID, because usernames can be released and re-claimed by
      strangers.

    disteleplus_auto_match_usernames: Match Telegram senders to Discourse
      accounts automatically when the Telegram @username is identical to a
      Discourse username. Staff accounts are never auto-matched — posting as
      a moderator or admin always requires an explicit row in
      {{setting:disteleplus_user_map}}. Turn this off to require an explicit
      mapping for everyone.

    disteleplus_user_mappings: 'Legacy pipe-delimited mappings, replaced by
      the table editor in {{setting:disteleplus_user_map}}. Existing values
      were migrated automatically; this setting is no longer read.'

    disteleplus_encrypt_at_rest: Encrypt message text in the database (AES-256,
      key derived from the site secret) so a database dump alone does not
      expose the conversation. Uploads are stored as normal Discourse uploads.
      Search decrypts server-side.
    disteleplus_typing_to_telegram: Show a "typing…" status in the Telegram
      group while a Discourse member is typing. Telegram never sends typing
      events to bots, so the reverse direction is not possible.
    disteleplus_read_receipts_enabled: Show read receipts on your own messages
      in the conversation — a double check plus "Seen by N" once other members'
      read cursors pass the message. Telegram exposes no read data to bots, so
      the count reflects forum-side readers only.
    disteleplus_quote_in_topic_enabled: Offer "Quote in new topic" in a
      message's context menu, prefilling a new forum topic with the quoted
      message.
    disteleplus_polls_enabled: Create real Discourse polls from the
      conversation composer — voting, results and auto-close all run on
      core's poll engine via a hidden backing topic. Telegram members
      receive the question with a link to vote here; bots cannot cast
      Telegram votes, so the forum poll is the single source of truth.
    disteleplus_polls_topic_id: Hidden holder topic for the conversation
      polls' backing posts. Managed automatically.
    disteleplus_event_messages: Forum events that post an automatic system
      message into the conversation — new topics, first logins, suspensions,
      silences. These stay in the conversation (no bell notifications, no
      Telegram mirror — Telegram has its own reports pipeline). Review-queue
      items are deliberately not on this list, because staff already get a
      bell notification for each one and a chat line would repeat the same
      report.
    disteleplus_bridge_uploads: Copy photos, documents, video and audio across
      the bridge, in both directions, up to the size limit below. When off,
      media is replaced by a short placeholder line.

    disteleplus_max_upload_mb: Files above this size are not copied — a
      Telegram file becomes a placeholder line in chat, and a Discourse
      upload becomes a link to the forum (which needs a login if secure
      uploads are on). 20 MB is the hard ceiling; the Telegram Bot API
      refuses to hand bots anything larger.

    disteleplus_bridge_edits: Editing a message updates the copy on the other
      side. One exception, a Telegram limitation rather than a setting —
      editing a Telegram-originated message inside Discourse changes only the
      Discourse copy, because a bot cannot edit somebody else's Telegram
      message.

    disteleplus_bridge_deletes: Deleting a bridged chat message deletes it
      on the other side too, whichever side it was written on. Here to
      Telegram the bot needs delete permission in the group, and Telegram
      only lets a bot delete messages under 48 hours old; failures are logged
      to /logs. Telegram to here needs disteleplus_deletion_check_chat_id.

    disteleplus_deletion_check_chat_id: Telegram never tells a bot that a
      message was deleted, so to delete here what was deleted on Telegram the
      bridge checks. Make a private channel, add the bot as an admin that can
      post and delete messages, and put the channel's id here (it starts with
      -100). Every five minutes the bot copies the bridged messages into it
      and deletes the copies at once; one Telegram can't find was deleted
      there, and is deleted here. The last hour's messages are checked each
      time, a week's about hourly. Empty, nothing is checked.

    disteleplus_bridge_polls: Bridge Telegram polls into chat as a text
      snapshot of the question and options, rewritten as votes come in so the
      counts stay roughly current. Voting from Discourse is not possible.

    disteleplus_bridge_reaction_notices: When a Discourse member reacts to a
      bridged message, post a short "Name reacted 👍" reply under the Telegram
      copy (silently, no push). The bot's own reaction on the message cannot
      show who reacted, so this is the only way the Telegram side learns it.
    disteleplus_bridge_reactions: Telegram reactions appear as chat
      reactions — from the matching Discourse user when there is one, from
      the bridge bot otherwise. Reactions sent under a group's anonymous
      identity are skipped. In the other direction Telegram allows a bot
      exactly one reaction per message, so all Discourse reactions on a
      message collapse into the most recent one.

    disteleplus_forum_uploads_enabled: Copy attachments from ordinary forum
      posts into a dedicated Telegram Forum Topic. This is an additional
      archive copy only; the forum Upload remains untouched and authoritative.
      Personal messages, whispers, deleted/hidden posts, and restricted
      categories are excluded by default.

    disteleplus_forum_upload_topic_id: Telegram message_thread_id of the
      archive topic. Create the topic in the bridged supergroup, send a message
      there, and read message_thread_id from the bot update. This must differ
      from {{setting:disteleplus_chat_topic_id}}. Do not use 1 — that is the
      group's General topic, Telegram refuses it as a thread id, and every
      archive send fails; run /disteleplus_create_uploads in Telegram instead.

    disteleplus_forum_upload_topic_name: Human-readable name shown by setup
      commands and used when the bot creates the archive topic. Telegram still
      requires a numeric thread ID internally; the setup wizard saves it
      automatically so administrators do not need to copy it.

    disteleplus_forum_upload_category_ids: Categories whose post attachments
      are mirrored. Empty means every eligible normal forum category.
      Subcategories are not selected automatically when this list is used.

    disteleplus_forum_upload_include_restricted_categories: Also copy uploads
      from read-restricted categories. This can disclose staff or private
      material to every Telegram group member; leave off unless the audiences
      are deliberately identical. Personal messages and whispers remain
      excluded even when enabled.

    disteleplus_forum_upload_max_mb: Largest file copied into Telegram. The
      Bot API currently caps bot-sent files at 50 MB. Larger or unreadable
      files produce a metadata message linking back to the forum instead.

    disteleplus_forum_upload_backfill_batch_size: Number of historical upload
      references examined per backfill step. Smaller batches reduce load and
      queue bursts, including for posts containing many attachments.

    disteleplus_forum_upload_backfill_pause_seconds: Delay between historical
      batches. Delivery receipts make repeated runs resume safely and skip
      attachment occurrences already sent.

    disteleplus_forum_upload_backfill_spacing_seconds: Minimum spacing between
      historical Telegram sends. The default is 4 seconds (15 per minute),
      below Telegram's 20-messages-per-minute group limit. Live uploads remain
      immediate; Telegram 429 responses are still retried as a safety net.

    disteleplus_forum_upload_measure_now: Measure eligible posts, occurrences,
      unique files, bytes, date range, extensions, oversize files, and prior
      deliveries, including unique content hashes, without sending anything.
      Results are written to /logs under the [jtech-tools disteleplus] tag,
      then this switch resets itself.

    disteleplus_forum_upload_backfill_now: Start or resume the historical
      archive. A measurement is logged first, work runs in paced batches, and
      a final measurement is logged at completion. This switch resets itself.

    disteleplus_chat_button_opens_bridge: The header chat button, and the
      bare /chat page, open the bridge conversation directly instead of the
      chat home — for everyone, admins included, and independent of the
      full chat lock below. Needs {{setting:disteleplus_chat_channel_id}}
      to be set; does nothing until then.

    disteleplus_lock_chat_ui: Turns chat into this one conversation. Creating
      channels, direct messages and threads is hidden and refused by the
      server for everyone — administrators included, with no exemption — and
      every chat hub page (channel list, DMs, browse) redirects to the bridge
      channel. Turn the lock off to create something, then turn it back on.
      Set {{setting:disteleplus_chat_channel_id}} first; the lock does nothing
      until a channel ID is set.

    disteleplus_lock_chat_exempt_admins: While the lock is active, let admins
      still open the chat hub pages (channel list, DMs, browse) instead of
      being redirected to the bridge channel. This is browsing only —
      creating channels, DMs or threads stays blocked for admins exactly like
      everyone else. Moderators are never exempt.

    disteleplus_force_channel_notifications: Enrol every user in the allowed
      groups into the native conversation at notification level "always"
      (desktop alerts and web push). A sync runs every 30 minutes plus whenever
      someone is created, approved or added to a group. Web push still needs
      {{setting:push_notifications_prompt}} and each person to have accepted
      push on at least one device. /disteleplus_status in Telegram reports how
      many members are at "always".

    disteleplus_notification_sync_now: Runs the channel-notification enrolment
      right now instead of waiting for the next scheduled sync. Turn on and
      save; it queues the job and switches itself back off. Results are logged
      to /logs as "notification sync".

    disteleplus_voice_notes_enabled: Adds a microphone button to the native
      composer that records a voice note in the browser and sends it as its
      own message, and replaces the browser's default audio controls with a
      compact waveform player (play, scrub, speed, download). Voice
      notes reach Telegram as real voice bubbles; Telegram voice messages
      arrive here the same way. Enabling this adds ogg, webm, m4a and opus to
      {{setting:authorized_extensions}} if they are missing. Telegram voice
      bubbles from Chrome/Edge recordings (WebM) need ffmpeg on the server;
      without it those notes arrive in Telegram as audio files instead.

    disteleplus_voice_note_max_seconds: Longest voice note the composer will
      record. Recording stops automatically at this length.

    disteleplus_voice_notes_bridge_channel_only: Show the microphone button
      only in the bridged channel. Turn off to allow voice notes in every chat
      channel and DM (they are still only forwarded to Telegram from the
      bridged channel).

    disteleplus_voice_player_all_audio: Use the waveform player for every
      audio file in chat, not just voice notes. Turn off to keep the browser's
      default controls for ordinary music/audio uploads.

    disteleplus_forum_post_notifications_enabled: Post a summary of new forum
      posts into the bridged Telegram conversation (and the native
      conversation), the way the chat-integration plugin does. Personal
      messages, whispers, hidden posts and read-restricted categories are
      never sent.
    disteleplus_forum_post_categories: Only announce posts in these categories
      (subcategories of a listed category count). Empty means every public
      category.
    disteleplus_forum_post_tags: Only announce topics carrying at least one of
      these tags. Empty means any tag.
    disteleplus_forum_post_first_post_only: Announce only the first post of a
      topic. Turn off to announce every reply as well.
    disteleplus_forum_post_excerpt_length: Characters of the post to include
      under the title. Zero sends the title only.
    disteleplus_reports_enabled: Mirror the Discourse review queue into a
      Telegram topic. Every new flag, post awaiting approval and user review
      appears as a message with Approve / Deny / More buttons; resolving a
      report (from Telegram or from Discourse) edits the message to show who
      handled it. Buttons only work for staff mapped by Telegram numeric ID
      in {{setting:disteleplus_user_map}}. Bind the destination by sending
      /disteleplus_bind_reports inside the desired Telegram topic.
    disteleplus_reports_chat_id: Numeric Telegram chat ID that receives
      moderation reports. Leave blank to use the bridged group from
      {{setting:disteleplus_telegram_chat_id}}. Point it at a separate
      private staff group to keep flagged content away from members — the
      bot must be an administrator there too.
    disteleplus_reports_topic_id: Telegram Forum Topic ID (message_thread_id)
      of the reports topic. Leave at zero — the plugin creates a topic named
      {{setting:disteleplus_reports_topic_name}} in the reports chat on its
      own and stores the id here (the group needs Topics enabled and the bot
      the Manage Topics right). Reports are never posted into General; if the
      topic is deleted in Telegram a new one is created. When the reports
      topic lives inside the bridged group, messages written in it are
      excluded from the member conversation automatically.
    disteleplus_reports_topic_name: Name given to the Telegram forum topic
      the plugin creates for moderation reports.
    disteleplus_reports_excerpt_length: Characters of the flagged/queued
      content shown in the report message. Zero hides the excerpt entirely
      (the More button still shows details on demand).
    disteleplus_reports_admin_notices: Also post admin notices into the
      reports topic — new-feature announcements ("What's new"), admin
      dashboard problem alerts, and a who→whom note when an official warning
      is issued (the warning's text stays private).
    disteleplus_forum_post_link_preview: Let Telegram render its link preview
      card under the announcement.
    disteleplus_send_test_message_now: Send a test message to the bridged
      group now to verify the token, chat id and topic. The switch resets
      itself; a failure appears on the admin dashboard.
    disteleplus_register_webhook_now: Tells Telegram where to deliver this
      group's messages. Turn on and save; it generates the webhook secret if
      it is still blank, calls setWebhook, installs the admin-only
      /disteleplus_* command menu, then switches itself back off (the checkbox
      stays ticked until you reload the page). There is no success message —
      check /logs for "setWebhook OK". Run this after first setup, after
      changing the bot token or webhook secret, and after changing the forum's
      domain. Toggling {{setting:disteleplus_setup_commands_enabled}} refreshes
      or removes the command menu automatically.

    # ── Jtech — REQ-PM ─────────────────────────────────────────────────────
    reqpm_enabled: REQ-PM lets members exchange contact details (phone, text,
      WhatsApp, email, website, or their own custom ones) instead of private
      messages. Members request each other's details or send their own, and
      choose exactly which ones to send. There is no free text, details are
      encrypted in the database, and staff cannot view them — not in the UI,
      through the API, or by impersonating.
    reqpm_allowed_groups: Groups that can use REQ-PM (send, request and
      receive). Staged, suspended, silenced and anonymous-mode accounts are
      always left out. Default trust_level_0 is every signed-in member; use
      trust_level_1 to keep brand-new accounts out.
    reqpm_setup_prompt: 'How strongly members without any contact details are
      asked to add some — new signups and existing members alike. "Gentle"
      shows a friendly window they can snooze or turn down for good.
      "Required" brings it back on every page until they add at least one
      way to reach them, like a missing required profile field.'
    reqpm_setup_snooze_days: How long "Remind me later" hides the setup
      window for.
    reqpm_default_country_code: Country calling code assumed for phone,
      text, WhatsApp, Signal and Telegram numbers typed without one — 1 for
      US/Canada. A 10-digit number like 646-820-1413 is saved as
      +1 646-820-1413 so the Call, Text and Chat buttons reach the right
      country. Numbers starting with + or 00, or with a leading 0, are left
      as typed. Leave blank to never assume a country.
    reqpm_max_methods: Most contact methods one member can keep on their card.
    reqpm_max_requests_per_day: Most contact requests one member can send in
      24 hours. Applies to staff too.
    reqpm_max_shares_per_day: Most times one member can send their details
      (to anyone) in 24 hours. Applies to staff too.
    reqpm_request_cooldown_days: After asking someone, how many days before
      the same member can ask that person again — whatever the answer was.
      0 turns the cooldown off.
    reqpm_request_expiry_days: Unanswered requests close after this many
      days.

    # ── Jtech — Listing format ─────────────────────────────────────────────
    listing_format_enabled: Makes posts in the topics below follow a set
      format, for sale threads where every post is a listing. Replying opens
      a form with a box per field. A post that doesn't follow the format is
      turned away with the reason before it's saved. Each listing gets the
      seller's REQ-PM button in place of Reply, for people who can use
      REQ-PM. Posts from before a topic was added are never hidden or
      deleted.
    listing_format_topics: 'Topics where the format applies. Use the topic''s
      number or paste its address (like
      https://forum.example.com/t/phones-for-sale/32).
      New posts must have every field; edits to older posts only have to keep
      the fields they already had, and can''t add outside links.'
    listing_format_fields: 'Sections each listing needs. The reply form posts
      them in this order, each as a heading with the details under it
      ("### ITEM", then the item). Posts written by hand (edits, Dumbcourse)
      may also use a bold name or "ITEM: …" on one line, in any case. A
      section with nothing under it, or inside a quote, doesn''t count.'
    listing_format_optional_fields: Sections from the list above that may be
      left empty, such as IMAGES for a listing without pictures. The reply
      form marks them optional and leaves them out of the post when they're
      empty. Every other section has to have something in it.
    listing_format_single_choice: 'Sections where the reply form offers
      options to pick one of, written as "CONDITION: New, Like new, Used, For
      parts". The section still has a box for anything else ("small scratch
      on the back"). Only the form uses these; posts aren''t checked against
      the options.'
    listing_format_multiple_choice: 'Sections where the reply form offers
      options to tick any of, written as "PICKUP LOCATION OR SHIPPING
      AVAILABLE: Pickup*, Shipping available". The section still has a box for
      anything else. An option ending in * needs that box filled in when
      it''s picked: with Pickup*, a listing that ticks Pickup has to say
      where. That is checked for every post; otherwise posts aren''t checked
      against the options.'
    listing_format_editor_field: The section filled from the composer's
      editor, where pictures are uploaded; the others get a box each in the
      reply form. Leave blank, or name a section that isn't in the list
      above, to give every section a box and put the editor's text after
      them.
    listing_format_block_links: Turns away posts in these topics that link
      to other sites, typed or as a link. Email addresses, phone numbers and
      links to this forum and its uploads are allowed. Plain-text addresses
      like ebay.com are caught for common endings (.com, .net, .org, .co,
      .il and some others).
    listing_format_exempt_groups: Groups who can post in these topics
      without following the format, for reminders and staff notes. They also
      keep the Reply button on listings and use the plain composer.

    # ── Jtech — Mod elections ──────────────────────────────────────────────
    mod_elections_enabled: Lets the forum elect its moderators. Every few
      months (see the months below) nominations open, then Vote Week runs,
      and members rank the candidates. An admin checks the ballots and
      publishes the results from the Mod elections tab, which makes the
      winners moderators and removes the moderators who weren't elected.
      Admins are never on the ballot and never vote. Turning this off stops
      the schedule and hides the page; nothing already published changes.
    mod_elections_seats: How many moderators each election picks. Every seat
      is up in every election.
    mod_elections_view_allowed_groups: Groups that can open the elections page
      (the candidates, their statements, the ballot and the results) and get
      its sidebar link, banner and Dumbcourse menu entry. Trust level 1 by
      default. Logged-out visitors are sent to log in. Admins and moderators
      always can. Only people who can open the page are put on the voter list
      or can run, and someone who leaves these groups during an election
      loses their vote and their place on the ballot. Running and voting have
      their own rules below.
    mod_elections_schedule_months: Months an election starts in. Nominations
      open at midnight on the 1st, in the time zone below.
    mod_elections_timezone: Time zone the calendar runs in, as a name like
      America/New_York or Asia/Jerusalem.
    mod_elections_nomination_days: How long nominations stay open. Sitting
      moderators are on the ballot automatically and can drop out until
      nominations close.
    mod_elections_nomination_extension_days: When nominations close with no
      more candidates than seats, there's nothing to vote on, so they stay
      open this many more days, once, for others to run. Vote Week moves back
      by the same. If there are still no more candidates than seats after
      that, there's no Vote Week; they're elected unopposed when an admin
      publishes the results. 0 skips the extra days. Closing nominations
      early from the Mod elections tab never extends them.
    mod_elections_voting_days: How long Vote Week lasts, starting when
      nominations close. Voters can change their ballot until it ends.
    mod_elections_candidate_min_trust_level: Lowest trust level that can
      run. Sitting moderators can always run. A candidate who drops below it
      during the election, even in Vote Week, comes off the ballot.
    mod_elections_candidate_min_account_age_days: How old an account has to
      be to run.
    mod_elections_candidate_clean_record_days: Accounts an admin suspended
      or silenced within this many days can't run. A moderator's don't count,
      since sitting moderators are candidates too. 0 only checks whether they
      are suspended or silenced right now.
    mod_elections_statement_max_length: Longest statement a candidate can
      write about themselves. 0 turns statements off.
    mod_elections_voter_min_account_age_days: How old an account has to be,
      when nominations open, to vote. The voter list is fixed at that moment,
      and a vote counts as much as the voter's trust level then, up to 3
      (trust level 4 counts 3, trust level 0 doesn't vote). Someone suspended, silenced, anonymized or dropped to
      trust level 0 since can't vote, and if they still can't when Vote Week
      ends, a ballot they cast is set aside.
    mod_elections_moderators_cannot_vote: Sitting moderators don't vote. They're
      on the ballot, so this stops them choosing who joins or replaces them.
      With it on, they're left off the voter list when nominations open,
      can't cast a ballot, and the ballot of anyone who is a moderator when
      Vote Week ends is set aside (one cast before it was turned on too).
    mod_elections_former_mods_keep_tl4: Moderators who leave their seat
      (lose, step down or don't run) keep trust level 4, locked, so it marks
      people who were moderators. Trust level 4 can still edit posts and
      close, move and rename topics, so former moderators keep those powers.
      Winners are locked at trust level 4 when they take their seat. A
      moderator removed for abuse goes back to trust level 3 either way.
    mod_elections_strikes_before_tl3: A sitting moderator who runs again and
      loses gets a strike. At this many strikes they go back to trust level
      3, unlocked, and the usual trust level 3 rules apply again. Stepping
      down, not running, and losing while not in a seat give no strike.
    mod_elections_category: Category for each election's topic, where the
      forum is told when nominations open, who is running and who won. Leave
      blank for no topic.
    mod_elections_notify_voters: Sends voters a notification when Vote Week
      opens, and again a day before it ends to those who haven't voted.
    mod_elections_invite_candidates: Sends a notification to every member who
      can run when nominations open, and again if nominations stay open
      longer because not enough people are running. Sitting moderators are
      told they're on the ballot either way.

