        how: How the count works
        how_body: "Every ballot starts with its voter's weight on their first choice. Anyone who reaches the votes needed is elected, and the votes they didn't need move on to their voters' next choices at a reduced value. When nobody reaches it, whoever has the fewest votes is out and their ballots move to each voter's next choice. This repeats until every seat is filled. Anyone with no votes at all goes out in one step, as long as enough people are left to fill the seats."
