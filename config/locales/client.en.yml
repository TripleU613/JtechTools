            label: Measure upload archive
            confirm: This scans every eligible post for attachments and writes
              the totals to /logs. It sends nothing to Telegram. Run the
              measurement now?
            done: Measurement queued.
          backfill_forum_uploads:
            label: Start upload backfill
            confirm: This starts (or restarts from the beginning) copying
              historical forum attachments into the Telegram upload topic,
              paced by the backfill settings. Start now?
            done: Backfill queued.
          purge_phantom_likes:
            label: Purge phantom likes
            confirm: This applies the Dislike settings to existing likes in
              the restricted categories — removing their history rows and
              notifications unless history is kept — and recalculates likes
              given and received. It cannot be undone. Run it now?
            done: Purge queued.
